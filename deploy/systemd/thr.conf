# /etc/sp/thr.conf — M9a L1 规则阈值 (外置; 每规则读自己的段).
# 默认值 = ad-data-engine events.py v0 种子 — 上车前必须跑
# _m9a_thr_calib.py (3min 稳态观察 → 分位数重标, spec §9 纪律).
[quota]
dedup_window_s=5.0
per_event_per_min=12
global_per_min=15

[hard_brake]
acc_thr=-3.210
dur_s=0.5

[hard_accel]
acc_thr=1.079
dur_s=0.5

[low_speed_crawl]
speed_thr=2.0
win_s=5.0

[reverse]
speed_thr=-0.5
dur_s=0.3

[sharp_turn]
yaw_thr=0.412
dur_s=0.5

[sharp_lat]
lat_thr=1.678
dur_s=0.3

[u_turn]
win_s=3.0
deg_thr=120.0

[lead_hard_brake]
dist_thr=20.0
decel_thr=-3.0
v0_thr=2.0
dur_s=0.3

[slow_lead]
dist_thr=25.0
speed_thr=2.0
ego_thr=5.0

[stationary_approach]
ttc_thr=3.0
vlead_thr=0.5
ego_thr=1.0

[cut_in]
dist_thr=20.0
lat_edge=2.5
lat_in=2.0

[vru_near]
lon_min=-5.0
lon_max=30.0
lat_thr=2.0

[vru_cross]
lon_min=-5.0
lon_max=30.0
cross_thr=1.5
lat_thr=3.0

[construction_zone]
dist_thr=30.0
